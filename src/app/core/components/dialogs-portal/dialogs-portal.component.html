<div #viewContainer class="dialogs-portals">
  <ng-container *ngFor="let dialog of dialogs()">
    <ng-container *ngIf="dialog.isOpen()">
      <ng-container 
          [ngComponentOutlet]="dialog.component"
          [ngComponentOutletInjector]="dialog.injector">
      >
    </ng-container>
    </ng-container>
  </ng-container>
  <ng-content></ng-content>
</div>
